<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08140e"/>
      <stop offset="55%" stop-color="#113825"/>
      <stop offset="100%" stop-color="#0a2015"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#23975f" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#08140e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="35%" r="38%">
      <stop offset="0%" stop-color="#e3a63b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#08140e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kernelGrad" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#f0c27a"/>
      <stop offset="100%" stop-color="#b9772c"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173324"/>
      <stop offset="100%" stop-color="#0d1e15"/>
    </linearGradient>
  </defs>

  <!-- Main rounded canvas -->
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#glow1)"/>
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#glow2)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#244734" stroke-width="1.5"/>

  <!-- Subtle background grid accents -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
  </g>

  <!-- Left Medallion with optical brackets -->
  <g transform="translate(86, 94)">
    <!-- Viewfinder corner brackets -->
    <path d="M-12 20 V-2 Q-12 -12 -2 -12 H20" stroke="#e3a63b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M152 -12 H174 Q184 -12 184 -2 V20" stroke="#e3a63b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M-12 152 V174 Q-12 184 -2 184 H20" stroke="#e3a63b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M152 184 H174 Q184 184 184 174 V152" stroke="#e3a63b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Cream medallion -->
    <rect x="6" y="6" width="160" height="160" rx="42" fill="#f3e7ce"/>
    <!-- Kernel SVG -->
    <g transform="translate(36, 36) scale(1)">
      <g transform="rotate(-18 50 50)">
        <path d="M16 52c0-18 13-28 34-28s34 10 34 28-13 26-34 26S16 70 16 52z" fill="url(#kernelGrad)"/>
        <path d="M26 45c9-10 28-13 46-4" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Center Wordmark & Tagline -->
  <g transform="translate(316, 102)">
    <!-- Eyebrow pill -->
    <rect x="0" y="0" width="232" height="28" rx="14" fill="#1b432e" stroke="#2d6647" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#23975f"/>
    <text x="29" y="18.5" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#b7dec8">OPTICAL KERNEL GRADING</text>

    <!-- Brand Title -->
    <text x="0" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-2" fill="#f5faf7">
      Quali<tspan fill="#e3a63b">Pea</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="500" fill="#a5c4b3">
      Know every kernel’s grade — powered by YOLO11-cls &amp; Raspberry Pi 5.
    </text>

    <!-- Tech pills -->
    <g transform="translate(0, 156)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="55" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e6f2eb">Expo + RN</text>

      <rect x="120" y="0" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="184" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e6f2eb">Raspberry Pi 5</text>

      <rect x="258" y="0" width="114" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="315" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#e6f2eb">YOLO11-cls</text>

      <rect x="382" y="0" width="118" height="30" rx="15" fill="#e3a63b" fill-opacity="0.18" stroke="#e3a63b" stroke-opacity="0.45"/>
      <text x="441" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f5cc7a">Android APK</text>
    </g>
  </g>

  <!-- Right Live Result Mini Card -->
  <g transform="translate(918, 66)">
    <rect x="0" y="0" width="224" height="228" rx="28" fill="url(#cardBg)" stroke="#274b37" stroke-width="1.5"/>
    <text x="22" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#89aa98">LIVE RESULT</text>

    <!-- Grade A badge + Ring -->
    <rect x="22" y="48" width="66" height="66" rx="20" fill="#23975f"/>
    <text x="55" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff">A</text>

    <!-- Confidence Ring -->
    <g transform="translate(132, 48)">
      <circle cx="33" cy="33" r="27" stroke="#243f30" stroke-width="6" fill="none"/>
      <circle cx="33" cy="33" r="27" stroke="#e3a63b" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="159 170" transform="rotate(-90 33 33)"/>
      <text x="33" y="38" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">94%</text>
    </g>

    <text x="22" y="142" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#f3faf5">Grade A</text>
    <text x="22" y="162" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="500" fill="#8fa597">Premium quality · Confident</text>

    <!-- Mini probability bars -->
    <rect x="22" y="180" width="180" height="7" rx="3.5" fill="#1e3628"/>
    <rect x="22" y="180" width="166" height="7" rx="3.5" fill="#23975f"/>
    <rect x="22" y="196" width="180" height="7" rx="3.5" fill="#1e3628"/>
    <rect x="22" y="196" width="22" height="7" rx="3.5" fill="#d99a1c"/>
  </g>
</svg>
