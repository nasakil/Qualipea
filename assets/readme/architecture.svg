<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1811"/>
      <stop offset="100%" stop-color="#11291d"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e3a63b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#23975f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="260" rx="26" fill="url(#archBg)" stroke="#234131" stroke-width="1.5"/>

  <!-- Node 1: Mobile App -->
  <g transform="translate(46, 48)">
    <rect x="0" y="0" width="290" height="164" rx="22" fill="#14291e" stroke="#2c533e" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="14" fill="#23975f" fill-opacity="0.22"/>
    <rect x="33" y="30" width="18" height="24" rx="3" fill="none" stroke="#32c47d" stroke-width="2.2"/>
    <line x1="39" y1="49" x2="45" y2="49" stroke="#32c47d" stroke-width="2" stroke-linecap="round"/>

    <text x="76" y="38" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#f3faf5">QualiPea App</text>
    <text x="76" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#8fa597">Expo · React Native</text>

    <text x="20" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Live rear camera &amp; torch</text>
    <text x="20" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Demo mode &amp; swipe gestures</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Saved photo history &amp; analytics</text>
  </g>

  <!-- Connector 1 -->
  <g>
    <line x1="348" y1="112" x2="444" y2="112" stroke="#e3a63b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
    <text x="396" y="98" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#f0c27a">POST /predict</text>

    <line x1="444" y1="148" x2="348" y2="148" stroke="#23975f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="396" y="170" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#63d69c">JSON Grade</text>
  </g>

  <!-- Node 2: Raspberry Pi 5 -->
  <g transform="translate(455, 48)">
    <rect x="0" y="0" width="290" height="164" rx="22" fill="#14291e" stroke="#e3a63b" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="14" fill="#e3a63b" fill-opacity="0.2"/>
    <rect x="31" y="31" width="22" height="22" rx="4" fill="none" stroke="#e3a63b" stroke-width="2.2"/>
    <circle cx="42" cy="42" r="3" fill="#e3a63b"/>

    <text x="76" y="38" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#f3faf5">Raspberry Pi 5</text>
    <text x="76" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f0c27a">192.168.137.31:5000</text>

    <text x="20" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Local Wi-Fi / Hotspot Flask API</text>
    <text x="20" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Health checks (/health, /status)</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Editable URL right in Settings</text>
  </g>

  <!-- Connector 2 -->
  <g>
    <line x1="757" y1="130" x2="852" y2="130" stroke="#23975f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="805" y="116" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#63d69c">Inference</text>
  </g>

  <!-- Node 3: YOLO11-cls -->
  <g transform="translate(864, 48)">
    <rect x="0" y="0" width="290" height="164" rx="22" fill="#14291e" stroke="#2c533e" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="44" rx="14" fill="#23975f" fill-opacity="0.22"/>
    <circle cx="42" cy="42" r="10" fill="none" stroke="#32c47d" stroke-width="2.2"/>
    <circle cx="42" cy="42" r="3.5" fill="#32c47d"/>

    <text x="76" y="38" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#f3faf5">YOLO11-cls</text>
    <text x="76" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#8fa597">3-Class Vision Model</text>

    <text x="20" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Classifies Grade A, B, or C</text>
    <text x="20" y="118" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Per-class probability breakdown</text>
    <text x="20" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b7d0c1">• Auto-flags &lt;75% confidence</text>
  </g>
</svg>
