    <rect x="22" y="24" width="76" height="76" rx="22" fill="#26241e" stroke="#314a3b" stroke-width="1"/>
    <g transform="translate(30, 32) scale(0.6)">
      <g transform="rotate(-18 50 50)">
        <path d="M16 52c0-18 13-28 34-28s34 10 34 28-13 26-34 26S16 70 16 52z" fill="url(#gB)"/>
        <path d="M26 45c9-10 28-13 46-4" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linecap="round"/>
