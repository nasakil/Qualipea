    <text x="22" y="134" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#eef6f0">Intermediate Quality</text>
    <text x="22" y="160" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#8fa597">Minor visual variation; suitable for</text>
    <text x="22" y="179" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#8fa597">processing or buyer-confirmed lots.</text>
