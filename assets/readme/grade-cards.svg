  <!-- Card 3: Grade C -->
  <g transform="translate(820, 10)">
    <rect x="0" y="0" width="380" height="200" rx="26" fill="#101f17" stroke="#244030" stroke-width="1.5"/>
    <rect x="22" y="24" width="76" height="76" rx="22" fill="#26241e" stroke="#314a3b" stroke-width="1"/>
