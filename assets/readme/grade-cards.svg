    <text x="22" y="134" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#eef6f0">Premium Quality</text>
    <text x="22" y="160" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#8fa597">Clean, uniform kernels ready for top-tier</text>
    <text x="22" y="179" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#8fa597">sorting and sealed dry storage.</text>
  </g>

  <!-- Card 2: Grade B -->
  <g transform="translate(410, 10)">
